name: conda package

# Builds the `ultra` conda package (recipe/recipe.yaml) and uploads it to the
# prefix.dev channel named by the PREFIX_CHANNEL repo variable (default codegod100).
# Upload authenticates with prefix.dev trusted publishing (GitHub OIDC), or with
# the PREFIX_API_KEY repo secret when that is set.
# Version is 0.1.<commit count>, so every push to main gets a new one.

on:
  push:
    branches: [main]
    paths: ["ultra/**", "tools/ultra.py", "recipe/**", ".github/workflows/conda.yml"]
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      PREFIX_CHANNEL: ${{ vars.PREFIX_CHANNEL || 'codegod100' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install rattler-build
        run: |
          curl -fsSL -o /usr/local/bin/rattler-build \
            https://github.com/prefix-dev/rattler-build/releases/latest/download/rattler-build-x86_64-unknown-linux-musl
          chmod +x /usr/local/bin/rattler-build
          rattler-build --version
      - name: Build and test
        run: |
          export ULTRA_VERSION="0.1.$(git rev-list --count HEAD)"
          echo "version $ULTRA_VERSION"
          rattler-build build -r recipe/recipe.yaml -c conda-forge --output-dir out --log-style plain
      - uses: actions/upload-artifact@v4
        with:
          name: ultra-conda
          path: out/noarch/*.conda
      - name: Upload to prefix.dev
        env:
          PREFIX_API_KEY: ${{ secrets.PREFIX_API_KEY }}
        run: |
          [ -n "$PREFIX_API_KEY" ] || unset PREFIX_API_KEY
          rattler-build upload prefix --skip-existing -c "$PREFIX_CHANNEL" out/noarch/*.conda

[workspace]
name = "ultra"
description = "Elm-style frontend framework: LPython apps compiled to WebAssembly"
channels = ["https://conda.anaconda.org/conda-forge"]
platforms = ["linux-64", "osx-64", "osx-arm64", "win-64"]

[dependencies]
python = "3.12.*"
lpython = "0.22.*"
nodejs = ">=22"

[tasks]
build = { cmd = "python tools/ultra.py build examples/counter/app.py examples/todo/app.py examples/bench/app.py examples/life/app.py examples/ui/app.py examples/launcher/app.py", description = "Compile the example apps to wasm" }
serve = { cmd = "python tools/ultra.py serve", description = "Serve the repo on http://localhost:8000" }
install-playwright = { cmd = "npm install --no-save --no-package-lock playwright@1.56.1 && npx playwright install chromium", description = "Fetch Playwright and Chromium for the browser test" }
test = { cmd = "python tools/ultra.py test", depends-on = ["build"], description = "Build, then run the browser test against a local server" }
